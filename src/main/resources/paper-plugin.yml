name: ${name}
version: ${version}
main: ${main}
api-version: "${apiVersion}"
# The update check runs on Paper's async/global-region schedulers and every
# command touches only its caller's thread, so the plugin is safe on Folia.
folia-supported: true
author: ${author}
description: ${description}
website: ${website}
# Paper's loader ignores Bukkit's legacy softdepend key (and without a declared
# relationship PlaceholderAPI's classes are invisible to this plugin), so the
# optional dependency is declared here: load after PAPI when it is present and
# join its classpath so the expansion classes resolve.
dependencies:
  server:
    PlaceholderAPI:
      load: AFTER
      required: false
      join-classpath: true
    LuckPerms:
      load: AFTER
      required: false
      join-classpath: true
permissions:
  juicytpa.tpa:
    description: Send /tpa requests.
    default: true
  juicytpa.tpahere:
    description: Send /tpahere requests.
    default: true
  juicytpa.accept:
    description: Accept incoming TP requests with /tpaccept.
    default: true
  juicytpa.deny:
    description: Deny incoming TP requests with /tpadeny.
    default: true
  juicytpa.cancel:
    description: Cancel outgoing TP requests with /tpacancel.
    default: true
  juicytpa.list:
    description: List pending TP requests with /tpalist.
    default: true
  juicytpa.trust:
    description: Trust players with /tpatrust.
    default: true
  juicytpa.mode:
    description: Change your TPA mode with /tpamode.
    default: true
  juicytpa.block:
    description: Block requests from specific players with /tpablock.
    default: true
  juicytpa.tpall:
    description: Send requests to everyone with /tpall, and use @a in /tpa and /tpahere.
    default: op
  juicytpa.reload:
    description: Reload the JuicyTPA configuration.
    default: op
  juicytpa.help:
    description: View the JuicyTPA help listing.
    default: true
  juicytpa.version:
    description: View the JuicyTPA version.
    default: true
  juicytpa.language:
    description: Show or set your own language with /tpalanguage.
    default: true
