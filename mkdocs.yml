site_name: JuicyTPA
site_description: A modern 26.x plugin for /tpa and /tpahere.
site_url: https://jruk8.github.io/JuicyTPA/
repo_url: https://github.com/jruk8/JuicyTPA
repo_name: GitHub

theme:
  variant: modern
  language: en
  custom_dir: overrides
  logo: assets/juicytpa-icon-darkmode.png
  favicon: assets/juicytpa-favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - announce.dismiss
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Basics:
      - Commands: basics/commands.md
      - Requests: basics/requests.md
      - Receiving: basics/receiving.md
  - Configuration:
      - Overview: configuration.md
      - Requests: configuration/requests.md
      - Warnings: configuration/warnings.md
      - Messages: configuration/messages.md
      - Sounds: configuration/sounds.md
  - Advanced:
      - Permissions: advanced/permissions.md
      - LuckPerms: advanced/luckperms.md
      - Placeholders: advanced/placeholders.md
      - Plugin API:
          - advanced/api/index.md
          - advanced/api/events.md
          - advanced/api/actions.md
      - Extending: advanced/extending.md

extra:
  discord_url: https://discord.com/invite/hkWmCVmWDC
  logo_light: assets/juicytpa-icon-lightmode.png
  # No generator backlink in the footer (SEO: no third-party links).
  generator: false
